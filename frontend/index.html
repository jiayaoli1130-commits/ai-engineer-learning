<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>RAG AI Agent</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f6f7f9;
    }

    h1 {
      text-align: center;
    }

    section {
      background: white;
      padding: 20px;
      margin-bottom: 24px;
      border-radius: 10px;
    }

    textarea,
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
      margin-top: 8px;
    }

    textarea {
      height: 100px;
    }

    button {
      margin-top: 12px;
      margin-right: 8px;
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    .output {
      margin-top: 16px;
      padding: 16px;
      background: #f1f3f5;
      border-radius: 8px;
      min-height: 80px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .document-list {
      margin-top: 16px;
      padding: 0;
      list-style: none;
    }

    .document-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .document-meta {
      min-width: 0;
    }

    .document-name {
      font-weight: 600;
    }

    .document-id {
      color: #6b7280;
      font-size: 13px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>企业知识库 RAG Agent</h1>

  <section>
    <h2>一、AI 对话</h2>
    <textarea id="chatMessage" placeholder="例如：我在淘宝买了人体工学椅，可以报销吗？"></textarea>
    <button onclick="sendChat()">发送给 AI</button>
    <div id="chatOutput" class="output">AI 回答会显示在这里。</div>
  </section>

  <section>
    <h2>二、知识库检索</h2>
    <input id="searchQuery" placeholder="例如：人体工学椅报销" />
    <button onclick="searchKnowledge()">检索知识库</button>
    <div id="searchOutput" class="output">检索结果会显示在这里。</div>
  </section>

  <section>
    <h2>三、知识库管理</h2>
    <input id="filePath" value="./docs/company_rules.md" />
    <button onclick="ingestKnowledge()">入库文档</button>
    <button onclick="resetKnowledge()">重置知识库</button>
    <h3>上传文件入库</h3>
    <input id="uploadFile" type="file" accept=".txt,.md,.pdf" />
    <button onclick="uploadKnowledgeFile()">上传并入库</button>
    <h3>已入库文档</h3>
    <button onclick="listKnowledgeDocuments()">刷新文档列表</button>
    <input id="deleteDocumentId" placeholder="输入 document_id 删除指定文档" />
    <button onclick="deleteKnowledgeDocument()">删除文档</button>
    <ul id="documentList" class="document-list"></ul>
    <div id="manageOutput" class="output">管理结果会显示在这里。</div>
  </section>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    async function sendChat() {
      const message = document.getElementById("chatMessage").value.trim();
      const output = document.getElementById("chatOutput");

      if (!message) {
        output.textContent = "请输入问题。";
        return;
      }

      output.textContent = "AI 正在思考中...";

      try {
        const response = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const result = await response.json();

        if (result.code === 200) {
          output.textContent = result.data;
        } else {
          output.textContent = "请求失败：" + result.msg;
        }
      } catch (error) {
        output.textContent = "请求出错：" + error.message;
      }
    }

    async function searchKnowledge() {
      const query = document.getElementById("searchQuery").value.trim();
      const output = document.getElementById("searchOutput");

      if (!query) {
        output.textContent = "请输入检索关键词。";
        return;
      }

      output.textContent = "正在检索知识库...";

      try {
        const response = await fetch(`${API_BASE}/knowledge/search`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            query: query,
            n_results: 3
          })
        });

        const result = await response.json();

        if (result.code === 200) {
          output.textContent = JSON.stringify(result.data, null, 2);
        } else {
          output.textContent = "检索失败：" + result.msg;
        }
      } catch (error) {
        output.textContent = "请求出错：" + error.message;
      }
    }

    async function ingestKnowledge() {
      const filePath = document.getElementById("filePath").value.trim();
      const output = document.getElementById("manageOutput");

      if (!filePath) {
        output.textContent = "请输入文件路径。";
        return;
      }

      output.textContent = "正在入库文档...";

      try {
        const response = await fetch(`${API_BASE}/knowledge/ingest`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            file_path: filePath
          })
        });

        const result = await response.json();

        if (result.code === 200) {
          output.textContent = JSON.stringify(result.data, null, 2);
          await listKnowledgeDocuments();
        } else {
          output.textContent = "入库失败：" + result.msg;
        }
      } catch (error) {
        output.textContent = "请求出错：" + error.message;
      }
    }

    async function uploadKnowledgeFile() {
      const fileInput = document.getElementById("uploadFile");
      const output = document.getElementById("manageOutput");

      if (!fileInput.files.length) {
        output.textContent = "请选择要上传的文件。";
        return;
      }

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append("file", file);

      output.textContent = "正在上传并入库...";

      try {
        const response = await fetch(`${API_BASE}/knowledge/upload`, {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        if (result.code === 200) {
          output.textContent = JSON.stringify(result.data, null, 2);
          await listKnowledgeDocuments();
        } else {
          output.textContent = "上传失败：" + result.msg;
        }
      } catch (error) {
        output.textContent = "请求出错：" + error.message;
      }
    }

    async function resetKnowledge() {
      const output = document.getElementById("manageOutput");

      const confirmed = confirm("确定要重置知识库吗？这会清空当前 ChromaDB collection。");

      if (!confirmed) {
        return;
      }

      output.textContent = "正在重置知识库...";

      try {
        const response = await fetch(`${API_BASE}/knowledge/reset`, {
          method: "POST"
        });

        const result = await response.json();

        if (result.code === 200) {
          output.textContent = JSON.stringify(result.data, null, 2);
        } else {
          output.textContent = "重置失败：" + result.msg;
        }
      } catch (error) {
        output.textContent = "请求出错：" + error.message;
      }
    }

    async function listKnowledgeDocuments() {
      const output = document.getElementById("manageOutput");
      const list = document.getElementById("documentList");

      try {
        const response = await fetch(`${API_BASE}/knowledge/documents`);
        const result = await response.json();

        if (result.code !== 200) {
          output.textContent = "获取文档列表失败：" + result.msg;
          return;
        }

        const documents = result.data || [];

        if (!documents.length) {
          list.innerHTML = "";
          output.textContent = "当前没有已入库文档。";
          return;
        }

        list.innerHTML = documents.map((document) => `
          <li class="document-item">
            <div class="document-meta">
              <div class="document-name">${escapeHtml(document.filename || "未命名文档")}</div>
              <div class="document-id">${escapeHtml(document.document_id || "")}</div>
              <div class="document-id">${escapeHtml(document.source || "")}</div>
              <div class="document-id">chunks: ${escapeHtml(String(document.total_chunks || 0))}</div>
            </div>
            <button onclick="fillDeleteDocumentId('${escapeAttribute(document.document_id || "")}')">选择删除</button>
          </li>
        `).join("");

        output.textContent = JSON.stringify(documents, null, 2);
      } catch (error) {
        output.textContent = "请求出错：" + error.message;
      }
    }

    async function deleteKnowledgeDocument() {
      const documentIdInput = document.getElementById("deleteDocumentId");
      const documentId = documentIdInput.value.trim();
      const output = document.getElementById("manageOutput");

      if (!documentId) {
        output.textContent = "请输入要删除的 document_id。";
        return;
      }

      const confirmed = confirm(`确定要删除文档 ${documentId} 吗？`);

      if (!confirmed) {
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/knowledge/delete`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            document_id: documentId
          })
        });

        const result = await response.json();

        if (result.code === 200) {
          output.textContent = JSON.stringify(result.data, null, 2);
          documentIdInput.value = "";
          await listKnowledgeDocuments();
        } else {
          output.textContent = "删除失败：" + result.msg;
        }
      } catch (error) {
        output.textContent = "请求出错：" + error.message;
      }
    }

    function fillDeleteDocumentId(documentId) {
      document.getElementById("deleteDocumentId").value = documentId;
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }
  </script>
</body>
</html>
