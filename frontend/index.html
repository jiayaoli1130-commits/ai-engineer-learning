<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>RAG AI Agent</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f6f7f9;
    }

    h1 {
      text-align: center;
    }

    section {
      background: white;
      padding: 20px;
      margin-bottom: 24px;
      border-radius: 10px;
    }

    textarea,
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
      margin-top: 8px;
    }

    textarea {
      height: 100px;
    }

    button {
      margin-top: 12px;
      margin-right: 8px;
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    .output {
      margin-top: 16px;
      padding: 16px;
      background: #f1f3f5;
      border-radius: 8px;
      min-height: 80px;
      line-height: 1.6;
      word-break: break-word;
    }

    .plain-text {
      white-space: pre-wrap;
    }

    .markdown-body p:first-child {
      margin-top: 0;
    }

    .markdown-body p:last-child,
    .markdown-body ul:last-child,
    .markdown-body ol:last-child {
      margin-bottom: 0;
    }

    .markdown-body code {
      background: #e9ecef;
      border-radius: 4px;
      padding: 2px 4px;
    }

    .search-result {
      background: white;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .search-result-meta {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .document-card-list {
      margin-top: 16px;
    }

    .document-card {
      background: white;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .document-card div {
      margin-bottom: 4px;
      word-break: break-all;
    }

    .document-card button {
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>企业知识库 RAG Agent</h1>

  <section>
    <h2>一、AI 对话</h2>
    <textarea id="chatMessage" placeholder="例如：我在淘宝买了人体工学椅，可以报销吗？"></textarea>
    <button onclick="sendChat()">发送给 AI</button>
    <div id="chatOutput" class="output">AI 回答会显示在这里。</div>
  </section>

  <section>
    <h2>二、知识库检索</h2>
    <input id="searchQuery" placeholder="例如：人体工学椅报销" />
    <input id="maxDistance" type="number" min="0" step="0.01" placeholder="可选：distance 阈值，例如 1.2" />
    <button onclick="searchKnowledge()">检索知识库</button>
    <div id="searchOutput" class="output">检索结果会显示在这里。</div>
  </section>

  <section>
    <h2>三、知识库管理</h2>
    <input id="filePath" value="./docs/company_rules.md" />
    <button onclick="ingestKnowledge()">入库文档</button>
    <button onclick="resetKnowledge()">重置知识库</button>
    <h3>上传文件入库</h3>
    <input id="uploadFile" type="file" accept=".txt,.md,.pdf" />
    <button onclick="uploadKnowledgeFile()">上传并入库</button>
    <div id="manageOutput" class="output">管理结果会显示在这里。</div>
  </section>

  <section>
    <h2>四、已入库文档</h2>
    <button onclick="loadDocuments()">刷新文档列表</button>
    <div id="documentsOutput" class="output document-card-list">文档列表会显示在这里。</div>
  </section>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    function setPlainText(element, text) {
      element.classList.remove("markdown-body");
      element.classList.add("plain-text");
      element.textContent = text;
    }

    function markdownToHtml(markdown) {
      if (!window.marked || !window.DOMPurify) {
        return escapeHtml(markdown);
      }

      return DOMPurify.sanitize(marked.parse(String(markdown || "")));
    }

    function renderMarkdown(element, markdown) {
      element.classList.remove("plain-text");
      element.classList.add("markdown-body");
      element.innerHTML = markdownToHtml(markdown);
    }

    async function sendChat() {
      const message = document.getElementById("chatMessage").value.trim();
      const output = document.getElementById("chatOutput");

      if (!message) {
        setPlainText(output, "请输入问题。");
        return;
      }

      setPlainText(output, "AI 正在思考中...");

      try {
        const response = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const result = await response.json();

        if (result.code === 200) {
          renderMarkdown(output, result.data);
        } else {
          setPlainText(output, "请求失败：" + result.msg);
        }
      } catch (error) {
        setPlainText(output, "请求出错：" + error.message);
      }
    }

    async function searchKnowledge() {
      const query = document.getElementById("searchQuery").value.trim();
      const maxDistanceValue = document.getElementById("maxDistance").value.trim();
      const output = document.getElementById("searchOutput");

      if (!query) {
        setPlainText(output, "请输入检索关键词。");
        return;
      }

      const payload = {
        query: query,
        n_results: 3
      };

      if (maxDistanceValue) {
        const maxDistance = Number(maxDistanceValue);
        if (Number.isNaN(maxDistance) || maxDistance < 0) {
          setPlainText(output, "distance 阈值必须是大于等于 0 的数字。");
          return;
        }

        payload.max_distance = maxDistance;
      }

      setPlainText(output, "正在检索知识库...");

      try {
        const response = await fetch(`${API_BASE}/knowledge/search`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.code === 200) {
          renderSearchResults(output, result.data);
        } else {
          setPlainText(output, "检索失败：" + result.msg);
        }
      } catch (error) {
        setPlainText(output, "请求出错：" + error.message);
      }
    }

    function renderSearchResults(output, data) {
      const results = data.results || [];

      output.classList.remove("plain-text", "markdown-body");
      output.innerHTML = "";

      if (!results.length) {
        setPlainText(output, "没有命中符合条件的结果。");
        return;
      }

      results.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "search-result";

        const metadata = item.metadata || {};
        const meta = document.createElement("div");
        meta.className = "search-result-meta";
        meta.textContent = `#${index + 1} ${metadata.filename || metadata.source || "知识库片段"} · distance: ${item.distance ?? "N/A"} · score: ${item.score ?? "N/A"}`;

        const content = document.createElement("div");
        content.className = "markdown-body";
        content.innerHTML = markdownToHtml(item.content || "");

        card.appendChild(meta);
        card.appendChild(content);
        output.appendChild(card);
      });
    }

    async function ingestKnowledge() {
      const filePath = document.getElementById("filePath").value.trim();
      const output = document.getElementById("manageOutput");

      if (!filePath) {
        setPlainText(output, "请输入文件路径。");
        return;
      }

      setPlainText(output, "正在入库文档...");

      try {
        const response = await fetch(`${API_BASE}/knowledge/ingest`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            file_path: filePath
          })
        });

        const result = await response.json();

        if (result.code === 200) {
          setPlainText(output, JSON.stringify(result.data, null, 2));
          await loadDocuments();
        } else {
          setPlainText(output, "入库失败：" + result.msg);
        }
      } catch (error) {
        setPlainText(output, "请求出错：" + error.message);
      }
    }

    async function uploadKnowledgeFile() {
      const fileInput = document.getElementById("uploadFile");
      const output = document.getElementById("manageOutput");

      if (!fileInput.files.length) {
        setPlainText(output, "请选择要上传的文件。");
        return;
      }

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append("file", file);

      setPlainText(output, "正在上传并入库...");

      try {
        const response = await fetch(`${API_BASE}/knowledge/upload`, {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        if (result.code === 200) {
          setPlainText(output, JSON.stringify(result.data, null, 2));
          await loadDocuments();
        } else {
          setPlainText(output, "上传失败：" + result.msg);
        }
      } catch (error) {
        setPlainText(output, "请求出错：" + error.message);
      }
    }

    async function resetKnowledge() {
      const output = document.getElementById("manageOutput");

      const confirmed = confirm("确定要重置知识库吗？这会清空当前 ChromaDB collection。");

      if (!confirmed) {
        return;
      }

      setPlainText(output, "正在重置知识库...");

      try {
        const response = await fetch(`${API_BASE}/knowledge/reset`, {
          method: "POST"
        });

        const result = await response.json();

        if (result.code === 200) {
          setPlainText(output, JSON.stringify(result.data, null, 2));
          await loadDocuments();
        } else {
          setPlainText(output, "重置失败：" + result.msg);
        }
      } catch (error) {
        setPlainText(output, "请求出错：" + error.message);
      }
    }

    async function loadDocuments() {
      const output = document.getElementById("documentsOutput");

      setPlainText(output, "正在加载文档列表...");

      try {
        const response = await fetch(`${API_BASE}/knowledge/documents`);
        const result = await response.json();

        if (result.code !== 200) {
          setPlainText(output, "加载失败：" + result.msg);
          return;
        }

        const documents = result.data || [];

        if (!documents.length) {
          setPlainText(output, "当前知识库中没有文档。");
          return;
        }

        output.classList.remove("plain-text", "markdown-body");
        output.innerHTML = "";

        documents.forEach((doc) => {
          const card = document.createElement("div");
          card.className = "document-card";

          card.innerHTML = `
            <div><strong>文件名：</strong>${escapeHtml(doc.filename || "未命名文档")}</div>
            <div><strong>document_id：</strong>${escapeHtml(doc.document_id || "")}</div>
            <div><strong>路径：</strong>${escapeHtml(doc.source || "")}</div>
            <div><strong>chunk 数量：</strong>${escapeHtml(String(doc.total_chunks || 0))}</div>
          `;

          const deleteButton = document.createElement("button");
          deleteButton.textContent = "删除该文档";
          deleteButton.addEventListener("click", () => deleteDocument(doc.document_id || ""));
          card.appendChild(deleteButton);
          output.appendChild(card);
        });
      } catch (error) {
        setPlainText(output, "请求出错：" + error.message);
      }
    }

    async function deleteDocument(documentId) {
      if (!documentId) {
        setPlainText(document.getElementById("documentsOutput"), "缺少 document_id，无法删除。");
        return;
      }

      const confirmed = confirm(`确定要删除文档 ${documentId} 吗？`);

      if (!confirmed) {
        return;
      }

      const output = document.getElementById("documentsOutput");

      try {
        const response = await fetch(`${API_BASE}/knowledge/delete`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            document_id: documentId
          })
        });

        const result = await response.json();

        if (result.code === 200) {
          alert("删除成功");
          await loadDocuments();
        } else {
          setPlainText(output, "删除失败：" + result.msg);
        }
      } catch (error) {
        setPlainText(output, "请求出错：" + error.message);
      }
    }

    async function listKnowledgeDocuments() {
      await loadDocuments();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
